server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Browser and API share this origin (via nginx), so strip Origin to
        # avoid backend CORS rejection (403) regardless of the access port.
        proxy_set_header Origin "";
    }

    # Hashed build assets: cache forever (names change on every build)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell, so the browser always picks up new asset hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React single-page app: fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}