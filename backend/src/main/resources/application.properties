server.port=8085

# Dev database: in-memory H2. Switch with: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:salesdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Order number format: <prefix><4 digit running number>
app.order-no-prefix=RM-D4/DGF/26-27/D-
app.po-no-prefix=TTPL/26/
app.company-name=TOTALA TEXTILES PRIVATE LIMITED
app.cors.allowed-origins=http://localhost:5175
