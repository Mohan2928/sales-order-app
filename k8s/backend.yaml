apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: salesorder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: salesorder-backend:v5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: APP_SEED_MODE
              value: never
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/salesdb
            - name: SPRING_DATASOURCE_USERNAME
              value: salesapp
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: salesorder-secret
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: salesorder
spec:
  selector:
    app: backend
  ports:
    - port: 8085
      targetPort: 8085